services:
  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
    - ./backend:/app
    ports:
    - 8000:8000
    env_file:
    - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672//
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
    - 3000:3000
    volumes:
    - ./frontend:/app
    - /app/node_modules
    environment:
      NODE_ENV: development
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000/api/v1}
    depends_on:
    - backend
    restart: unless-stopped
  db:
    image: postgres:15
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 5s
      timeout: 5s
      retries: 3
    volumes:
    - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
    - 5433:5432
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3-management
    ports:
    - 5672:5672
    - 15672:15672
    env_file:
    - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - check_port_connectivity
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
  celery_worker:
    build: ./backend
    command: celery -A tatarlang.celery worker --loglevel=info
    volumes:
    - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
    - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672//
  celery_beat:
    build: ./backend
    command: celery -A tatarlang.celery beat --loglevel=info
    volumes:
    - ./backend:/app
    env_file:
    - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672//
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  flower:
    build: ./backend
    command: celery -A tatarlang.celery flower --port=5555
    ports:
    - 5555:5555
    env_file:
    - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672//
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  migrate:
    build: ./backend
    command: python manage.py migrate --noinput
    env_file:
    - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data: null
  rabbitmq_data: null
