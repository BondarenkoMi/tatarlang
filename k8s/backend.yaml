---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tataredu
  labels:
    app: backend
    app.kubernetes.io/part-of: tataredu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Init-контейнеры последовательно ждут готовности зависимостей.
      # Основной контейнер не стартует, пока все init-контейнеры не завершатся успешно.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z postgres 5432; do
                sleep 2
              done
              echo "PostgreSQL is ready."
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for RabbitMQ..."
              until nc -z rabbitmq 5672; do
                sleep 2
              done
              echo "RabbitMQ is ready."
      containers:
        - name: backend
          image: tataredu/backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: tataredu-config
            - secretRef:
                name: tataredu-secret
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: tataredu
  labels:
    app: backend
    app.kubernetes.io/part-of: tataredu
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
      name: http
