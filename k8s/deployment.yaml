apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: tataredu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app-container
        image: my-app-image:latest
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: app-config