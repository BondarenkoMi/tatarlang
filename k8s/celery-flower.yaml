---
# Flower — веб-интерфейс мониторинга Celery-задач (порт 5555).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-flower
  namespace: tataredu
  labels:
    app: celery-flower
    app.kubernetes.io/part-of: tataredu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-flower
  template:
    metadata:
      labels:
        app: celery-flower
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq 5672; do sleep 2; done
              echo "RabbitMQ is ready."
      containers:
        - name: celery-flower
          image: tataredu/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - tatarlang.celery
            - flower
            - --port=5555
          ports:
            - containerPort: 5555
              name: flower
          envFrom:
            - configMapRef:
                name: tataredu-config
            - secretRef:
                name: tataredu-secret
          readinessProbe:
            tcpSocket:
              port: 5555
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: celery-flower
  namespace: tataredu
  labels:
    app: celery-flower
    app.kubernetes.io/part-of: tataredu
spec:
  selector:
    app: celery-flower
  ports:
    - port: 5555
      targetPort: 5555
      name: flower
