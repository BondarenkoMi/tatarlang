---
# Celery Worker — обрабатывает асинхронные задачи из очереди RabbitMQ.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: tataredu
  labels:
    app: celery-worker
    app.kubernetes.io/part-of: tataredu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do sleep 2; done
              echo "PostgreSQL is ready."
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq 5672; do sleep 2; done
              echo "RabbitMQ is ready."
      containers:
        - name: celery-worker
          image: tataredu/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - tatarlang.celery
            - worker
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: tataredu-config
            - secretRef:
                name: tataredu-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
