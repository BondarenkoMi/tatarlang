apiVersion: v1
kind: ConfigMap
metadata:
  name: tataredu-config
  namespace: tataredu
  labels:
    app.kubernetes.io/part-of: tataredu
data:
  POSTGRES_DB: "tatarlang"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  DEBUG: "True"
  ALLOWED_HOSTS: "localhost,127.0.0.1,tataredu.test"
  REACT_APP_API_URL: "/api/v1"
  NODE_ENV: "development"
  REDIS_HOST: "redis"
  CSRF_TRUSTED_ORIGINS: "https://tataredu.test"
