apiVersion: v1
kind: ConfigMap
metadata:
  name: tataredu-config
  namespace: tataredu
  labels:
    app.kubernetes.io/part-of: tataredu
data:
  # PostgreSQL settings (non-sensitive)
  POSTGRES_DB: "tatarlang"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"

  # Django settings
  DEBUG: "True"
  ALLOWED_HOSTS: "*"

  # Frontend API URL (used by React browser client — must be external URL)
  REACT_APP_API_URL: "https://tataredu.local/api/v1"

  # Node environment for React dev server
  NODE_ENV: "development"
