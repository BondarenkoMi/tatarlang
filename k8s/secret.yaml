# Пример. Заполните secret.local.yaml; apply.sh использует локальный файл.
apiVersion: v1
kind: Secret
metadata:
  name: tataredu-secret
  namespace: tataredu
  labels:
    app.kubernetes.io/part-of: tataredu
type: Opaque
stringData:
  POSTGRES_USER: REPLACE_ME
  POSTGRES_PASSWORD: REPLACE_ME
  RABBITMQ_USER: REPLACE_ME
  RABBITMQ_PASS: REPLACE_ME
  CELERY_BROKER_URL: REPLACE_ME
  DJANGO_SECRET_KEY: REPLACE_ME
