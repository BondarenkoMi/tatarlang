---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: tataredu
  labels:
    app: celery-beat
    app.kubernetes.io/part-of: tataredu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq 5672; do sleep 2; done
              echo "RabbitMQ is ready."
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do sleep 2; done
              echo "PostgreSQL is ready."
      containers:
        - name: celery-beat
          image: tataredu/backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - tatarlang.celery
            - beat
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: tataredu-config
            - secretRef:
                name: tataredu-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
