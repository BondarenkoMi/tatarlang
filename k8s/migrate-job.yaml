---

apiVersion: batch/v1
kind: Job
metadata:
  name: django-migrate
  namespace: tataredu
  labels:
    app: django-migrate
    app.kubernetes.io/part-of: tataredu
spec:
  backoffLimit: 3        
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: django-migrate
    spec:
      restartPolicy: OnFailure

      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until nc -z postgres 5432; do
                echo "PostgreSQL is unavailable - sleeping 2s"
                sleep 2
              done
              echo "PostgreSQL is up - running migrations"
      containers:
        - name: migrate
          image: tataredu/backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: tataredu-config
            - secretRef:
                name: tataredu-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
