---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: django-clearsessions
  namespace: tataredu
  labels:
    app: django-clearsessions
    app.kubernetes.io/part-of: tataredu
spec:
  schedule: "0 3 * * *"           # Каждый день в 03:00 UTC
  concurrencyPolicy: Forbid        # Не запускать новый Job, если предыдущий ещё работает
  successfulJobsHistoryLimit: 3    # Хранить историю 3 успешных запусков
  failedJobsHistoryLimit: 1        # Хранить историю 1 неудачного запуска
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: django-clearsessions
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: wait-for-postgres
              image: busybox:1.36
              command:
                - sh
                - -c
                - |
                  until nc -z postgres 5432; do sleep 2; done
                  echo "PostgreSQL is ready."
          containers:
            - name: clearsessions
              image: tataredu/backend:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "manage.py", "clearsessions"]
              envFrom:
                - configMapRef:
                    name: tataredu-config
                - secretRef:
                    name: tataredu-secret
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
