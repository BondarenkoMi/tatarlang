---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tataredu
  labels:
    app: frontend
    app.kubernetes.io/part-of: tataredu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # Init-контейнер ждёт готовности backend API перед стартом фронтенда
      initContainers:
        - name: wait-for-backend
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for backend..."
              until nc -z backend 8000; do sleep 2; done
              echo "Backend is ready."
      containers:
        - name: frontend
          image: tataredu/frontend:latest
          imagePullPolicy: IfNotPresent
          command: ["npm", "start"]
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: REACT_APP_API_URL
              valueFrom:
                configMapKeyRef:
                  name: tataredu-config
                  key: REACT_APP_API_URL
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: tataredu-config
                  key: NODE_ENV

            - name: BROWSER
              value: "none"
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tataredu
  labels:
    app: frontend
    app.kubernetes.io/part-of: tataredu
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      name: http
