apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tataredu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend:latest
          imagePullPolicy: Never  # собери свой образ из ./frontend
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: development
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tataredu
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      name: http
