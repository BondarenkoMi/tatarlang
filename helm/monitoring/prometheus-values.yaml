alertmanager:
  enabled: true

  persistence:
    enabled: true
    size: 1Gi
    storageClass: standard

prometheus-pushgateway:
  enabled: false

kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      cpu: 150m
      memory: 128Mi

prometheus-node-exporter:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      cpu: 100m
      memory: 64Mi

server:
  retention: 15d
  retentionSize: 500MB

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  persistentVolume:
    enabled: true
    size: 2Gi
    storageClass: standard

  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - prometheus.tataredu.test
    path: /
    pathType: Prefix

configmapReload:
  prometheus:
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 48Mi

extraScrapeConfigs: |
  - job_name: ingress-nginx
    metrics_path: /metrics
    static_configs:
      - targets:
          - ingress-nginx-controller-metrics.ingress-nginx.svc.cluster.local:10254