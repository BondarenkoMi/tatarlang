apiVersion: v2
name: vault
description: Vault for Tataredu secrets management
type: application
version: 0.1.0
appVersion: "1.27.0"
dependencies:
  - name: vault
    version: "0.27.0"
    # Официальный Helm chart Vault от HashiCorp из ArtifactHub
    # ArtifactHub: https://artifacthub.io/packages/helm/hashicorp/vault
    # Если проблемы с 403 - использовать зеркало или OCI registry
    repository: https://helm.releases.hashicorp.com
    condition: vault.enabled

