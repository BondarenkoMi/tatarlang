vault:
  global:
    enabled: true
  server:
    dev:
      enabled: false    # выключаем dev-mode
    ha:
      enabled: false    # для локального minikube можно оставить false
    dataStorage:
      enabled: true
      # StatefulSet уже создан с claim template на 10Gi. Уменьшать PVC нельзя.
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
      hosts:
        - host: vault.tataredu.test
          paths:
            - /
      tls:
        - secretName: vault-tls
          hosts:
            - vault.tataredu.test
  ui:
    enabled: true
    serviceType: ClusterIP
  injector:
    enabled: false
