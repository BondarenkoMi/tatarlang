# =============================================================================
# helm/secrets.yaml — чувствительные values с ref-ссылками на Vault.
# Файл обрабатывается vals: все ref+vault://... заменяются на реальные значения.
# НЕ ХРАНИТЬ реальные пароли в этом файле — только refs!
#
# Применяется через deploy.sh:
#   vals eval -f helm/secrets.yaml | helm upgrade --install ... -f -
#
# Путь в Vault: secret/tataredu/{postgres,rabbitmq,django}
# Создание секретов: bash helm/scripts/vault-setup.sh
# =============================================================================

# Переопределяет значения из tataredu/values.yaml
postgres:
  user:     ref+vault://secret/tataredu/postgres#user
  password: ref+vault://secret/tataredu/postgres#password
  database: ref+vault://secret/tataredu/postgres#database

# Значения для subchart postgresql (должны совпадать с postgres.password выше)
postgresql:
  auth:
    postgresPassword: ref+vault://secret/tataredu/postgres#password
    database:         ref+vault://secret/tataredu/postgres#database

# Значения для subchart rabbitmq (bitnami) — credentials для запуска RabbitMQ и tataredu-secret
rabbitmq:
  auth:
    username: ref+vault://secret/tataredu/rabbitmq#user
    password: ref+vault://secret/tataredu/rabbitmq#password

# Значения для subchart redis
redis:
  auth:
    password: ref+vault://secret/tataredu/redis#password
