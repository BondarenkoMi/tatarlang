apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rabbitmq.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
