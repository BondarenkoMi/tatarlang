{{- if .Values.persistence.enabled }}
{{- if eq .Values.persistence.storageClass "manual" }}
---
# PersistentVolume — кластерный ресурс (без namespace).
# hostPath: данные хранятся на узле minikube.
# Перед деплоем создайте директорию на узле:
#   minikube ssh "sudo mkdir -p {{ .Values.persistence.hostPath }} && sudo chmod 777 {{ .Values.persistence.hostPath }}"
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "postgresql.fullname" . }}-pv
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.persistence.size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: {{ .Values.persistence.hostPath | quote }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "postgresql.fullname" . }}-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
