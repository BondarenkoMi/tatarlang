apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-celery-flower
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: flower
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: celery-flower
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: flower
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flower
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: celery-flower
    spec:
      # enableServiceLinks: false предотвращает конфликт CELERY_FLOWER_PORT
      enableServiceLinks: false
      initContainers:
        - name: wait-for-rabbitmq
          image: "{{ .Values.global.busybox.repository }}:{{ .Values.global.busybox.tag }}"
          command:
            - sh
            - -c
            - |
              until nc -z {{ tpl .Values.global.rabbitmqHost . }} 5672; do
                echo "Waiting for RabbitMQ at {{ tpl .Values.global.rabbitmqHost . }}:5672..."
                sleep 2
              done
              echo "RabbitMQ is ready."
      containers:
        - name: celery-flower
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - celery
            - -A
            - tatarlang.celery
            - flower
            - --port={{ .Values.port }}
            - --url_prefix=flower
          ports:
            - name: flower
              containerPort: {{ .Values.port }}
          envFrom:
            {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ tpl . $ }}
            {{- end }}
            {{- range .Values.envFromConfigMaps }}
            - configMapRef:
                name: {{ tpl . $ }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
