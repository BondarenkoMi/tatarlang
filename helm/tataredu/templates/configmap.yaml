apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tataredu.configmapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tataredu.labels" . | nindent 4 }}
data:
  # PostgreSQL (non-sensitive)
  POSTGRES_DB:   {{ .Values.postgres.database | quote }}
  POSTGRES_HOST: {{ include "tataredu.postgresHost" . | quote }}
  POSTGRES_PORT: {{ .Values.postgres.port | quote }}

  # Django
  DEBUG:         {{ .Values.django.debug | quote }}
  ALLOWED_HOSTS: {{ .Values.django.allowedHosts | quote }}

  CSRF_TRUSTED_ORIGINS: {{ printf "https://%s" .Values.ingress.host | quote }}

  # Frontend — URL, который браузер использует для вызова API (внешний через Ingress)
  REACT_APP_API_URL: "/api/v1"
  NODE_ENV:          {{ .Values.frontend.nodeEnv | quote }}

  # Redis (non-sensitive)
  REDIS_HOST: {{ include "tataredu.redisHost" . | quote }}
  REDIS_PORT: "6379"
  REDIS_DB:   "0"
  EXTERNAL_CACHE_TTL: {{ .Values.externalCache.ttl | quote }}
