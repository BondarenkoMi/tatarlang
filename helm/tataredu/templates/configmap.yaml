apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tataredu.configMapName" . }}
  namespace: {{ .Values.namespace | default (include "tataredu.fullname" .) }}
  labels:
    {{- include "tataredu.labels" . | nindent 4 }}
data:
  POSTGRES_DB: {{ .Values.config.postgres.db }}
  POSTGRES_USER: {{ .Values.config.postgres.user }}
  POSTGRES_HOST: {{ include "tataredu.postgresHost" . }}
  POSTGRES_PORT: {{ .Values.config.postgres.port | quote }}
  RABBITMQ_USER: {{ .Values.config.rabbitmq.user }}
  REACT_APP_API_URL: {{ .Values.config.reactAppApiUrl }}
  CELERY_BROKER_URL: {{ .Values.config.celeryBrokerUrl }}


