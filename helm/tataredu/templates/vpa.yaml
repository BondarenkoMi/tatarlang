{{- if and .Values.backend.vpa .Values.backend.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "tataredu.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tataredu.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "tataredu.fullname" . }}-backend
  updatePolicy:
    updateMode: {{ .Values.backend.vpa.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: backend
        controlledResources:
          - memory
        minAllowed:
          memory: {{ .Values.backend.vpa.minAllowedMemory }}
        maxAllowed:
          memory: {{ .Values.backend.vpa.maxAllowedMemory }}
{{- end }}
