apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tataredu.secretName" . }}
  namespace: {{ .Values.namespace | default (include "tataredu.fullname" .) }}
  labels:
    {{- include "tataredu.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | b64enc }}
  RABBITMQ_PASS: {{ .Values.secrets.rabbitmqPassword | b64enc }}


