apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tataredu.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tataredu.labels" . | nindent 4 }}
type: Opaque
data:
  DJANGO_SECRET_KEY: {{ required "Set django.secretKey via helm/secrets.yaml (Vault) or local values" .Values.django.secretKey | b64enc | quote }}
  POSTGRES_USER:     {{ required "Set postgres.user via helm/secrets.yaml (Vault) or local values" .Values.postgres.user | b64enc | quote }}
  POSTGRES_PASSWORD: {{ required "Set postgres.password via helm/secrets.yaml (Vault) or local values" .Values.postgres.password | b64enc | quote }}
  RABBITMQ_USER:     {{ required "Set rabbitmq.auth.username via helm/secrets.yaml (Vault) or local values" .Values.rabbitmq.auth.username | b64enc | quote }}
  RABBITMQ_PASS:     {{ required "Set rabbitmq.auth.password via helm/secrets.yaml (Vault) or local values" .Values.rabbitmq.auth.password | b64enc | quote }}
  # CELERY_BROKER_URL строится из credentials + DNS-имени RabbitMQ сервиса
  CELERY_BROKER_URL: {{ include "tataredu.celeryBrokerUrl" . | b64enc | quote }}
  REDIS_PASSWORD:    {{ required "Set redis.auth.password via helm/secrets.yaml (Vault) or local values" .Values.redis.auth.password | b64enc | quote }}
