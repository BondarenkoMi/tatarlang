
global:
  postgresHost: tataredu-postgresql
  rabbitmqHost: tataredu-rabbitmq
  redisHost: tataredu-redis
  busybox:
    repository: busybox
    tag: "1.36"

namespace:
  create: true
  name: tataredu

image:
  backend:
    repository: tataredu/backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: tataredu/frontend
    tag: latest
    pullPolicy: IfNotPresent

  busybox:
    repository: busybox
    tag: "1.36"


django:
  debug: "True"
  allowedHosts: "*"

backend:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi


frontend:
  replicas: 1
  nodeEnv: development
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi


celery:
  beat:

    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi


ingress:
  enabled: true
  className: nginx
  host: tataredu.test
  tls:
    enabled: true
    secretName: tataredu-tls
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"


migrate:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3


clearsessions:
  schedule: "0 3 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1


postgres:
  user: postgres
  password: postgres   # ref+vault://secret/tataredu/postgres#password
  database: tatarlang
  port: "5432"


# Subcharts


# -- PostgreSQL subchart (charts/postgresql/)
postgresql:
  auth:
    postgresPassword: postgres   
    database: tatarlang          
  persistence:
    enabled: true
    size: 5Gi
    storageClass: manual
    hostPath: /data/tataredu/postgres

# -- RabbitMQ subchart (bitnami/rabbitmq)
rabbitmq:
  auth:
    username: admin              # ref+vault://secret/tataredu/rabbitmq#user
    password: admin              # ref+vault://secret/tataredu/rabbitmq#password
    erlangCookie: tataredu-erlang-cookie
  service:
    type: LoadBalancer
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: rabbitmq.tataredu.test
    path: /
    pathType: Prefix
  persistence:
    enabled: false               
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -- Celery Worker subchart (charts/celery-worker/)
celery-worker:
  image:
    repository: tataredu/backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  envFromSecrets:
    - tataredu-secret
  envFromConfigMaps:
    - tataredu-config
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -- Flower subchart (charts/flower/)
flower:
  image:
    repository: tataredu/backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 5555
  envFromSecrets:
    - tataredu-secret
  envFromConfigMaps:
    - tataredu-config
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# -- Redis subchart (charts/redis/)
redis:
  auth:
    password: redis-secret-password  # ref+vault://secret/tataredu/redis#password
  service:
    type: LoadBalancer
  persistence:
    enabled: true
    size: 1Gi
    storageClass: manual
    hostPath: /data/tataredu/redis

# -- RedisInsight subchart (charts/redisinsight/)
redisinsight:
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: redisinsight.tataredu.test
    path: /
    pathType: Prefix
  persistence:
    enabled: true
    size: 512Mi
    storageClass: manual
    hostPath: /data/tataredu/redisinsight
