fullnameOverride: load-test-v2

image:
  repository: locustio/locust
  tag: "2.41.6"
  pullPolicy: IfNotPresent

target:
  # Use Kubernetes service DNS: /etc/hosts entries from the laptop are not
  # available inside Locust pods.
  host: http://tataredu-backend:8000

test:
  users: 100
  spawnRate: 20
  runTime: 2m
  workers: 2
  autostart: false

master:
  resources:
    requests:
      cpu: 100m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

worker:
  resources:
    requests:
      cpu: 150m
      memory: 128Mi
    limits:
      cpu: 750m
      memory: 384Mi

ingress:
  enabled: true
  className: nginx
  host: locust.tataredu.test
  annotations: {}
