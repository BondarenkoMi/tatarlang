apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-celery-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: celery-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: celery-worker
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: celery-worker
    spec:
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.global.busybox.repository }}:{{ .Values.global.busybox.tag }}"
          command:
            - sh
            - -c
            - |
              until nc -z {{ tpl .Values.global.postgresHost . }} 5432; do
                echo "Waiting for PostgreSQL at {{ tpl .Values.global.postgresHost . }}:5432..."
                sleep 2
              done
              echo "PostgreSQL is ready."
        - name: wait-for-rabbitmq
          image: "{{ .Values.global.busybox.repository }}:{{ .Values.global.busybox.tag }}"
          command:
            - sh
            - -c
            - |
              until nc -z {{ tpl .Values.global.rabbitmqHost . }} 5672; do
                echo "Waiting for RabbitMQ at {{ tpl .Values.global.rabbitmqHost . }}:5672..."
                sleep 2
              done
              echo "RabbitMQ is ready."
      containers:
        - name: celery-worker
          image: {{ default (printf "%s:%s" .Values.image.repository .Values.image.tag) (dig "werf" "images" "backend" "ref_tag" "" .Values.global) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - celery
            - -A
            - tatarlang.celery
            - worker
            - --loglevel=info
            - --concurrency={{ .Values.concurrency }}
          envFrom:
            {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ tpl . $ }}
            {{- end }}
            {{- range .Values.envFromConfigMaps }}
            - configMapRef:
                name: {{ tpl . $ }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
